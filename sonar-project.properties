# La clave y la organización de SonarQube Cloud se pasan desde el flujo de trabajo (.github/workflows/sonar.yml).
sonar.projectName=Blog de Noticias Accesible
sonar.sourceEncoding=UTF-8

# Todo el código de la aplicación se analiza (no se excluye ninguna carpeta).
sonar.sources=admin.php,api.php,article.php,captions.php,index.php,login.php,logout.php,saved.php,setup.php,sw.js,bin,includes,assets/js,assets/css
sonar.tests=tests
sonar.test.inclusions=tests/**/*

# Informes de cobertura generados por PHPUnit y por node --test
sonar.php.coverage.reportPaths=build/logs/clover.xml
sonar.php.tests.reportPath=build/logs/junit.xml
sonar.javascript.lcov.reportPaths=build/lcov.info
